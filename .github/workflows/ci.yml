name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop_smoke:
        description: Run the desktop smoke test under Xvfb
        type: boolean
        default: false
      macos_desktop_smoke:
        description: Run the desktop smoke test on macOS ARM64
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-checks:
    name: Plugin checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install the pinned Orca release
        shell: bash
        env:
          ORCA_VERSION: 1.4.274
          ORCA_DEB_SHA256: 96a2abd7172ac81338fe280678cdad4bd032c6d1591b11957acecae50ca54188
        run: |
          package="$RUNNER_TEMP/orca-ide_${ORCA_VERSION}_amd64.deb"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$package" \
            "https://github.com/stablyai/orca/releases/download/v${ORCA_VERSION}/orca-ide_${ORCA_VERSION}_amd64.deb"
          printf '%s  %s\n' "$ORCA_DEB_SHA256" "$package" | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "$package" sqlite3

      - name: Validate the plugin and run its tests
        run: ./scripts/check.sh

      - name: Run a playbook in the Orca desktop app
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_smoke
        run: |
          sudo apt-get install --yes --no-install-recommends xvfb xauth
          timeout --kill-after=5s 240s xvfb-run -a ./scripts/smoke-desktop.sh "$RUNNER_TEMP/playbooks.png"
          printf '%s\n' '### Orca desktop smoke' \
            'Start → Revise → OK passed. One seed, two drafts and one publish after approval.' \
            'Plan preview, decision handoff, and the final file matched the demo.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the demo panel screenshot
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playbooks-desktop-smoke
          path: ${{ runner.temp }}/playbooks.png
          if-no-files-found: error
          retention-days: 7

  macos-desktop:
    name: Playbooks desktop smoke (macOS ARM64)
    if: github.event_name == 'workflow_dispatch' && inputs.macos_desktop_smoke
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Extract the pinned Orca desktop build
        shell: bash
        env:
          ORCA_VERSION: 1.4.278
          ORCA_ARCHIVE_SHA256: d832885a97a7f58bf27917ca42404d0b98c835062f92d5502c94ab7278c7ba08
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/orca.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/stablyai/orca/releases/download/v${ORCA_VERSION}/Orca-${ORCA_VERSION}-arm64-mac.zip"
          printf '%s  %s\n' "$ORCA_ARCHIVE_SHA256" "$archive" | shasum -a 256 -c
          ditto -x -k "$archive" "$RUNNER_TEMP/orca-desktop"
          test -x "$RUNNER_TEMP/orca-desktop/Orca.app/Contents/MacOS/Orca"

      - name: Run the Playbooks demo in a fresh profile
        id: desktop-smoke
        shell: bash
        run: |
          if ! command -v timeout >/dev/null && ! command -v gtimeout >/dev/null; then
            brew install coreutils
          fi
          timeout_cmd=$(command -v timeout || command -v gtimeout)
          export ORCA_SMOKE_MAC_APP="$RUNNER_TEMP/orca-desktop/Orca.app"
          "$timeout_cmd" --kill-after=5s 240s ./scripts/smoke-desktop.sh "$RUNNER_TEMP/playbooks-macos.png"
          printf '%s\n' '### Playbooks desktop smoke (macOS ARM64)' \
            'Plan preview, cross-workspace decision handoff, and the final result passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the demo panel screenshot
        if: always() && steps.desktop-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playbooks-macos-desktop
          path: ${{ runner.temp }}/playbooks-macos.png
          if-no-files-found: warn
          retention-days: 7
