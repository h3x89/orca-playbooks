name: macOS worker history probe

on:
  push:
    branches: [h3x89/macos-desktop-probe]
    paths:
      - .github/workflows/macos-worker-history-probe.yml
      - scripts/fixtures/macos-open-chat/**

permissions:
  contents: read

jobs:
  worker-history:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stablyai/orca
          ref: f105ca47275a05867d505857d99ea45a2c0a395b
          path: orca-source
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: orca-source/package.json
          package-manager-cache: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          version: 12.18.0
          install: false

      - name: Prepare the pinned Orca source
        shell: bash
        working-directory: orca-source
        run: pnpm install --frozen-lockfile

      - name: Test a native worker with a fresh profile
        shell: bash
        working-directory: orca-source
        env:
          ORCA_E2E_FORWARD_APP_LOGS: '1'
          ORCA_BACKGROUND_LAUNCH: '1'
        run: |
          cp ../scripts/fixtures/macos-open-chat/{playbooks-worker-history.spec.ts,playbooks-fixture-report.cjs} \
            tests/e2e/golden-journeys/
          pnpm run test:e2e tests/e2e/golden-journeys/playbooks-worker-history.spec.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: worker-history-macos
          path: orca-source/test-results/
          if-no-files-found: ignore
          retention-days: 7
